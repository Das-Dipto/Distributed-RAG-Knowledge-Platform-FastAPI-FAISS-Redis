services:

  redis:
    image: redis:7-alpine

    container_name: rag-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .

    container_name: rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  worker:
    build: .

    container_name: rag-worker

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - .:/app

    command: python -m app.workers.worker